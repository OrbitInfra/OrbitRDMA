[package]
name = "orbit-rdma"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Linux RC RDMA transfers with registered host buffers and explicit completion receipts"
license = "Apache-2.0"
repository = "https://github.com/OrbitInfra/OrbitRDMA"
keywords = ["rdma", "infiniband", "roce", "verbs"]
categories = ["network-programming"]
readme = "README.md"
include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "docs/development-plan.md"]

[[example]]
name = "host_peer"
path = "tests/package/host_peer.rs"

[[example]]
name = "async_peer"
path = "tests/package/async_peer.rs"
required-features = ["tokio"]

[features]
default = []
cm = []
provider = []
mlx5 = ["provider"]
tokio = ["dep:tokio"]

[dependencies]
libloading = "0.8.9"
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1.52.3", optional = true, features = ["net", "rt", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[example]]
name = "advanced_peer"
path = "tests/package/advanced_peer.rs"

[[example]]
name = "cm_peer"
path = "tests/package/cm_peer.rs"
required-features = ["cm"]
